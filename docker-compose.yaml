services:
  # API and Web are created after this database container starts.
  onticards-db:
    image: postgres:15-alpine
    environment:
      # The bundled init.sql assumes the initial superuser is postgres.
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      # Local default only. Override DB_PASSWORD through an untracked root .env for production.
      POSTGRES_PASSWORD: "${DB_PASSWORD:-onticards_dev}"
      POSTGRES_DB: "${DB_DATABASE:-prod-ontiCards}"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./volumes/postgresql/data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - onticards

  # Version 1.36.x matches the repository's weaviate-client==4.20.4 dependency.
  onticards-weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_API_BASED_MODULES: "true"
      CLUSTER_HOSTNAME: node1
      GRPC_PORT: "50051"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./volumes/weaviate/data:/var/lib/weaviate
    restart: unless-stopped
    networks:
      - onticards

  onticards_api:
    build:
      context: ./OntiCards_Api
      dockerfile: Dockerfile
    image: onticards-api:local
    # Compose v2: build from the source context whenever this service is brought up.
    pull_policy: build
    env_file:
      - path: ./.env.prod
        required: true
      # This file is deliberately optional so a clean clone can start immediately.
      - path: ./.env
        required: false
    environment:
      # The entrypoint materializes the final container environment as /onticards_api/.env.
      COMPOSE_MANAGED_ENV: "1"
      PORT: "9103"
      # Docker DNS must take precedence over a developer's old local-IP configuration.
      DB_HOST: onticards-db
      DB_PORT: "5432"
      WEAVIATE_URL: http://onticards-weaviate:8080
      GRPC_PORT: "50051"
      GOVERNANCE_EXPORT_PATH: /data/governance/reports
    volumes:
      - ./volumes/governance/reports:/data/governance/reports
    depends_on:
      onticards-db:
        condition: service_started
      onticards-weaviate:
        condition: service_started
    restart: unless-stopped
    networks:
      - onticards

  # Web does not query the data services directly; these dependencies implement the requested startup order.
  onticards_web:
    build:
      context: ./OntiCards_Web
      dockerfile: Dockerfile
    image: onticards-web:local
    pull_policy: build
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DEPLOY_ENV: "${DEPLOY_ENV:-PRODUCTION}"
      TZ: "${TZ:-Asia/Shanghai}"
    depends_on:
      onticards-db:
        condition: service_started
      onticards-weaviate:
        condition: service_started
    restart: unless-stopped
    networks:
      - onticards

  # This is the only service exposed to the host. It starts after API and Web containers start.
  onticards_nginx:
    image: nginx:1.27-alpine
    environment:
      # The official nginx image renders this variable into the mounted template at startup.
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:-_}"
      # Protect native Nginx variables ($host, $scheme, etc.) from envsubst.
      NGINX_ENVSUBST_FILTER: "^NGINX_SERVER_NAME$$"
    ports:
      # Keep 9107 as the zero-configuration default; override NGINX_HOST_PORT
      # in an untracked .env when the host already uses that port.
      - "${NGINX_HOST_PORT:-9107}:9107"
    volumes:
      - ./nginx/onticards.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      onticards_api:
        condition: service_started
      onticards_web:
        condition: service_started
    restart: unless-stopped
    networks:
      - onticards

networks:
  onticards:
    # `name` prevents Compose from adding a project-name prefix and creates it when absent.
    name: onticards
    driver: bridge
