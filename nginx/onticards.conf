map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9107 default_server;
    # Rendered from NGINX_SERVER_NAME by the official nginx image at container startup.
    server_name ${NGINX_SERVER_NAME};

    client_max_body_size 200m;

    # Preserve /console/api in proxy_pass: the Flask application registers that prefix itself.
    location = /console/api {
        proxy_pass http://onticards_api:9103;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 28800s;
        proxy_read_timeout 28800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # The application health endpoint is intentionally registered outside the
    # Flask /console/api blueprint. Keep an externally testable API health URL
    # without changing the paths used by business API routes below.
    location = /console/api/healthz {
        proxy_pass http://onticards_api:9103/healthz;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    location ^~ /console/api/ {
        proxy_pass http://onticards_api:9103;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # NL2SQL, uploads and SSE-style streams may run for a long time.
        proxy_connect_timeout 60s;
        proxy_send_timeout 28800s;
        proxy_read_timeout 28800s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # All other routes are served by the Next.js application.
    location / {
        proxy_pass http://onticards_web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 28800s;
        proxy_read_timeout 28800s;
        proxy_buffering off;
    }
}
